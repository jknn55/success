<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARSF · تشفير وفك تشفير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f5ebd8;
    --cream-deep:#ece0c4;
    --card:#faf3e2;
    --ink:#2a0712;
    --ink-soft:#7a5b52;
    --wine-900:#2a0712;
    --wine-800:#3a0a1c;
    --wine-700:#440c22;
    --wine-600:#5c1230;
    --gold-300:#f2ddaa;
    --gold-400:#d9b562;
    --gold-500:#b98f3a;
    --gold-600:#8f6a2a;
    --success-bg:#eaf4ec;
    --success-text:#2f6b40;
    --success-line:#b9dcc0;
    --error-bg:#faeae7;
    --error-text:#8a2020;
    --error-line:#e7c2ba;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(185,143,58,0.12), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(68,12,34,0.09), transparent 40%),
      linear-gradient(180deg, var(--cream), var(--cream-deep));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem 1.2rem;
    color:var(--ink);
    position:relative;
    overflow-x:hidden;
  }
  .ring{
    position:fixed;
    border-radius:50%;
    border:1.5px dashed rgba(201,162,39,0.3);
    pointer-events:none;
  }
  .r1{width:220px;height:220px; top:-70px; left:-70px;}
  .r2{width:160px;height:160px; bottom:-50px; right:-50px;}

  .card{
    width:100%;
    max-width:560px;
    background:var(--card);
    border-radius:1.4rem;
    padding:2.6rem 2.4rem;
    border:1px solid var(--gold-400);
    box-shadow:
      0 0 0 1px var(--gold-300) inset,
      0 30px 60px -20px rgba(60,10,31,0.25),
      0 8px 20px -8px rgba(201,162,39,0.15);
    position:relative;
    z-index:1;
  }
  .card::before{
    content:'';
    position:absolute;
    inset:8px;
    border:1px solid rgba(201,162,39,0.35);
    border-radius:1.05rem;
    pointer-events:none;
  }

  .seal-row{
    display:flex;
    align-items:center;
    gap:0.7rem;
    margin-bottom:1.4rem;
  }
  .seal{
    width:44px; height:44px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--wine-700), var(--wine-900) 75%);
    border:2px solid var(--gold-500);
    box-shadow:0 0 0 3px var(--card), 0 0 0 4px var(--gold-400);
    display:flex; align-items:center; justify-content:center;
    font-size:1.1rem;
    flex-shrink:0;
    position:relative;
  }
  .seal::after{
    content:'';
    position:absolute;
    inset:5px;
    border-radius:50%;
    border:1px dashed rgba(237,220,160,0.6);
  }
  .brand{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.08em;
    color:var(--gold-600);
    text-transform:uppercase;
  }

  h1{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:2.1rem;
    color:var(--wine-900);
    margin-bottom:1.4rem;
    letter-spacing:0.01em;
    display:flex;
    align-items:center;
    gap:0.6rem;
  }

  /* ===== Tabs ===== */
  .tabs{
    display:flex;
    gap:0.5rem;
    margin-bottom:1.8rem;
    background:var(--cream-deep);
    padding:0.35rem;
    border-radius:0.9rem;
    border:1px solid var(--gold-400);
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    color:var(--wine-700);
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:0.92rem;
    padding:0.7rem 0.8rem;
    border-radius:0.65rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.4rem;
    transition:0.2s ease;
  }
  .tab-btn.active{
    background:linear-gradient(160deg, var(--wine-700), var(--wine-900));
    color:var(--gold-300);
    box-shadow:0 8px 16px -6px rgba(60,10,31,0.45);
  }
  .tab-btn:not(.active):hover{
    background:rgba(185,143,58,0.15);
  }

  .panel{display:none;}
  .panel.active{display:block; animation:fadeIn 0.25s ease;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .panel > h2.section-title{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:1.5rem;
    color:var(--wine-900);
    margin-bottom:1.1rem;
    padding-bottom:0.9rem;
    border-bottom:1px solid var(--gold-400);
    display:flex;
    align-items:center;
    gap:0.5rem;
  }

  .field{margin-bottom:1.35rem;}
  label{
    display:flex;
    align-items:center;
    gap:0.4rem;
    font-size:0.8rem;
    font-weight:700;
    color:var(--wine-700);
    margin-bottom:0.55rem;
    font-family:'Tajawal', sans-serif;
    letter-spacing:0.01em;
  }
  textarea, input[type="password"], input[type="text"]{
    width:100%;
    padding:0.95rem 1.25rem;
    background:#fffdf7;
    border:1.3px solid var(--gold-400);
    border-radius:0.7rem;
    color:var(--ink);
    font-size:0.97rem;
    outline:none;
    font-family:'Tajawal', sans-serif;
    transition:0.2s;
  }
  textarea{min-height:96px; resize:vertical; line-height:1.65;}
  textarea:focus, input:focus{
    border-color:var(--wine-600);
    box-shadow:0 0 0 3px rgba(138,34,69,0.12);
  }
  .row{display:flex; gap:1rem; margin-bottom:1.35rem;}
  .row .field{flex:1; margin-bottom:0;}
  .row .field.small{flex:0.5;}
  input:disabled{opacity:0.55; background:var(--cream);}

  .status{
    display:flex;
    align-items:flex-start;
    gap:0.7rem;
    padding:0.9rem 1.1rem;
    border-radius:0.7rem;
    font-size:0.88rem;
    font-weight:600;
    margin-bottom:1.1rem;
    line-height:1.6;
    border:1.3px solid transparent;
    animation:pop 0.25s ease;
  }
  @keyframes pop{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }
  .status.error{background:var(--error-bg); color:var(--error-text); border-color:var(--error-line);}
  .status.success{background:var(--success-bg); color:var(--success-text); border-color:var(--success-line);}
  .status .icon{font-size:1.1rem; line-height:1;}
  .hidden{display:none;}

  .actions{display:flex; gap:0.8rem; margin-top:0.4rem;}
  .btn{
    flex:1;
    border:none;
    padding:1rem 1.4rem;
    border-radius:0.7rem;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:0.98rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.5rem;
    transition:0.18s ease;
    letter-spacing:0.01em;
  }
  .btn-main{
    background:linear-gradient(160deg, var(--wine-700), var(--wine-900));
    color:var(--gold-300);
    border:1px solid var(--gold-500);
    box-shadow:0 10px 22px -8px rgba(60,10,31,0.5);
  }
  .btn-main:hover{transform:translateY(-2px); box-shadow:0 14px 26px -8px rgba(60,10,31,0.55);}
  .btn-main:active{transform:translateY(0);}
  .btn-main:disabled{opacity:0.7; cursor:default; transform:none;}
  .btn-ghost{
    background:transparent;
    color:var(--wine-700);
    border:1.3px solid var(--gold-400);
    flex:0.5;
  }
  .btn-ghost:hover{background:var(--cream);}

  /* small pill buttons for output row (encrypt panel) */
  .output-box{
    background:#fffdf7;
    border:1.3px solid var(--gold-400);
    border-radius:0.9rem;
    margin-top:0.2rem;
    overflow:hidden;
  }
  .output-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0.7rem 1.1rem 0.3rem;
    flex-wrap:wrap;
    gap:0.5rem;
  }
  .output-header span{font-size:0.76rem; color:var(--ink-soft); font-weight:700;}
  .output-actions{display:flex; gap:0.5rem;}
  .btn-pill{
    padding:0.4rem 0.9rem;
    font-size:0.75rem;
    border-radius:1.2rem;
    background:var(--cream-deep);
    color:var(--wine-700);
    border:1px solid var(--gold-400);
    cursor:pointer;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    gap:0.3rem;
    transition:0.15s;
  }
  .btn-pill:hover{background:var(--gold-300);}
  #outputText{
    background:transparent;
    border:none;
    width:100%;
    padding:0.5rem 1.1rem 1rem;
    color:var(--ink);
    font-size:0.9rem;
    min-height:80px;
    resize:vertical;
    outline:none;
    font-family:'Tajawal', sans-serif;
    word-break:break-all;
  }

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0;
    background:rgba(58,18,32,0.55);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.2rem;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .modal{
    width:100%;
    max-width:480px;
    background:var(--card);
    border-radius:1.2rem;
    padding:2.2rem 2rem 1.9rem;
    box-shadow:0 40px 80px -20px rgba(60,10,31,0.5);
    transform:translateY(14px) scale(0.97);
    transition:transform 0.28s cubic-bezier(.2,.9,.3,1.2);
    position:relative;
    border:1px solid var(--gold-500);
  }
  .modal::before{
    content:'';
    position:absolute;
    inset:7px;
    border:1px solid rgba(201,162,39,0.4);
    border-radius:0.9rem;
    pointer-events:none;
  }
  .overlay.show .modal{transform:translateY(0) scale(1);}
  .modal-icon{
    width:58px; height:58px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--wine-700), var(--wine-900) 75%);
    border:2px solid var(--gold-500);
    box-shadow:0 0 0 3px var(--card), 0 0 0 4px var(--gold-400);
    display:flex; align-items:center; justify-content:center;
    font-size:1.5rem;
    margin:0 auto 1.1rem;
  }
  .modal h2{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:1.4rem;
    text-align:center;
    color:var(--wine-900);
    margin-bottom:1.2rem;
  }
  .modal-body{
    background:#fffdf7;
    border:1.3px solid var(--gold-400);
    border-radius:0.8rem;
    padding:1rem 1.2rem;
    max-height:220px;
    overflow-y:auto;
    font-size:0.96rem;
    line-height:1.75;
    color:var(--ink);
    white-space:pre-wrap;
    word-break:break-word;
    margin-bottom:1.3rem;
  }
  .modal-actions{display:flex; gap:0.7rem;}
  .modal-actions .btn{padding:0.85rem 1.2rem; font-size:0.9rem;}
  .close-x{
    position:absolute;
    top:1.1rem; left:1.1rem;
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid var(--gold-400);
    background:var(--cream);
    color:var(--wine-700);
    font-size:1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:0.15s;
  }
  .close-x:hover{background:var(--gold-300);}

  .footer{
    font-size:0.72rem;
    color:var(--ink-soft);
    text-align:center;
    margin-top:1.6rem;
    border-top:1px solid rgba(201,162,39,0.35);
    padding-top:1.1rem;
    opacity:0.85;
  }

  @media (max-width:480px){
    .card{padding:2rem 1.4rem;}
    .row{flex-direction:column;}
    .row .field.small{flex:1;}
    .actions{flex-direction:column;}
    .btn-ghost{flex:1;}
    .modal{padding:1.9rem 1.3rem 1.6rem;}
    .tab-btn{font-size:0.85rem; padding:0.65rem 0.5rem;}
  }
</style>
</head>
<body>
<span class="ring r1"></span>
<span class="ring r2"></span>

<div class="card">
  <div class="seal-row">
    <div class="seal">🔒</div>
    <span class="brand">ARSF · AES-256-GCM</span>
  </div>
  <h1>🗝️ التشفير وفك التشفير</h1>

  <div class="tabs">
    <button class="tab-btn active" id="tabEncryptBtn" data-target="panelEncrypt">🔒 تشفير</button>
    <button class="tab-btn" id="tabDecryptBtn" data-target="panelDecrypt">🔓 فك التشفير</button>
  </div>

  <!-- ===== قسم التشفير ===== -->
  <div class="panel active" id="panelEncrypt">
    <h2 class="section-title">🔒 تشفير نص</h2>

    <div class="field">
      <label>النص المراد تشفيره</label>
      <textarea id="plainText" placeholder="أدخلي النص هنا..."></textarea>
    </div>

    <div class="row">
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="encPassword" placeholder="أدخلي كلمة المرور">
      </div>
      <div class="field small">
        <label>الإصدار</label>
        <input type="text" id="encVersionDisplay" value="ARSF1" disabled>
      </div>
    </div>

    <div id="encStatusBox" class="status hidden"></div>

    <div class="actions">
      <button class="btn btn-main" id="encryptBtn">تشفير</button>
      <button class="btn btn-ghost" id="encClearBtn">مسح</button>
    </div>

    <div class="output-box" style="margin-top:1.3rem;">
      <div class="output-header">
        <span>📦 الناتج المشفر</span>
        <div class="output-actions">
          <button class="btn-pill" id="copyOutBtn">📋 نسخ</button>
          <button class="btn-pill" id="saveOutBtn">💾 حفظ</button>
        </div>
      </div>
      <textarea id="outputText" placeholder="الناتج المشفر سيظهر هنا..." readonly></textarea>
    </div>
  </div>

  <!-- ===== قسم فك التشفير ===== -->
  <div class="panel" id="panelDecrypt">
    <h2 class="section-title">🔓 فك التشفير</h2>

    <div class="field">
      <label>النص المشفر</label>
      <textarea id="cipherText" placeholder="الصقي النص المشفر هنا (يبدأ بـ ARSF1$)..."></textarea>
    </div>

    <div class="row">
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="decPassword" placeholder="أدخلي كلمة المرور">
      </div>
      <div class="field small">
        <label>الإصدار</label>
        <input type="text" id="decVersionDisplay" value="ARSF1" disabled>
      </div>
    </div>

    <div id="decStatusBox" class="status hidden"></div>

    <div class="actions">
      <button class="btn btn-main" id="decryptBtn">فك التشفير</button>
      <button class="btn btn-ghost" id="decClearBtn">مسح</button>
    </div>
  </div>

  <div class="footer">ARSF1 · تشفير محلي بالكامل · لا تُرسل البيانات إلى أي خادم</div>
</div>

<!-- Result modal (لفك التشفير) -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-x" id="closeModal">✕</button>
    <div class="modal-icon">✓</div>
    <h2>تم فك التشفير بنجاح</h2>
    <div class="modal-body" id="modalResult"></div>
    <div class="modal-actions">
      <button class="btn btn-main" id="copyBtn">نسخ النص</button>
      <button class="btn btn-ghost" id="saveBtn">حفظ</button>
    </div>
  </div>
</div>

<script>
(function(){
  /* ===================== إعدادات مشتركة (كما هي دون أي تغيير) ===================== */
  const ARSF_MAGIC = 'ARSF1';
  const ARSF_VERSION = '1';
  const ITERATIONS = 310000;
  const SALT_BYTES = 32;
  const IV_BYTES = 12;

  function bufferToBase64(buf){
    const bytes = new Uint8Array(buf);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  function base64ToBuffer(str){
    const binary = atob(str);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  /* ===================== التبويبات ===================== */
  const tabEncryptBtn = document.getElementById('tabEncryptBtn');
  const tabDecryptBtn = document.getElementById('tabDecryptBtn');
  const panelEncrypt = document.getElementById('panelEncrypt');
  const panelDecrypt = document.getElementById('panelDecrypt');

  function activateTab(target){
    const tabs = [tabEncryptBtn, tabDecryptBtn];
    const panels = [panelEncrypt, panelDecrypt];
    tabs.forEach(t => t.classList.toggle('active', t.dataset.target === target));
    panels.forEach(p => p.classList.toggle('active', p.id === target));
  }
  tabEncryptBtn.addEventListener('click', () => activateTab('panelEncrypt'));
  tabDecryptBtn.addEventListener('click', () => activateTab('panelDecrypt'));

  /* ===================== قسم التشفير (منطق مطابق تمامًا للأصل) ===================== */
  const plainText = document.getElementById('plainText');
  const encPasswordInput = document.getElementById('encPassword');
  const outputText = document.getElementById('outputText');
  const encryptBtn = document.getElementById('encryptBtn');
  const encClearBtn = document.getElementById('encClearBtn');
  const copyOutBtn = document.getElementById('copyOutBtn');
  const saveOutBtn = document.getElementById('saveOutBtn');
  const encStatusBox = document.getElementById('encStatusBox');

  function showEncStatus(kind, message){
    encStatusBox.className = 'status ' + kind;
    const icon = kind === 'error' ? '⚠' : '✓';
    encStatusBox.innerHTML = `<span class="icon">${icon}</span><span>${message}</span>`;
  }
  function hideEncStatus(){
    encStatusBox.className = 'status hidden';
    encStatusBox.innerHTML = '';
  }

  async function encryptText(plain, password){
    const encoder = new TextEncoder();
    const plainBuffer = encoder.encode(plain);

    const salt = crypto.getRandomValues(new Uint8Array(SALT_BYTES));
    const iv = crypto.getRandomValues(new Uint8Array(IV_BYTES));

    const keyMaterial = await crypto.subtle.importKey(
      'raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']
    );

    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:salt, iterations:ITERATIONS, hash:'SHA-256' },
      keyMaterial, { name:'AES-GCM', length:256 }, false, ['encrypt']
    );

    const encrypted = await crypto.subtle.encrypt({ name:'AES-GCM', iv:iv }, key, plainBuffer);

    const saltB64 = bufferToBase64(salt);
    const ivB64 = bufferToBase64(iv);
    const dataB64 = bufferToBase64(encrypted);

    return `${ARSF_MAGIC}$${ARSF_VERSION}$${saltB64}$${ivB64}$${dataB64}`;
  }

  async function handleEncrypt(){
    hideEncStatus();
    const plain = plainText.value;
    const pwd = encPasswordInput.value;
    if (!plain){ showEncStatus('error', 'الرجاء إدخال نص للتشفير'); return; }
    if (!pwd){ showEncStatus('error', 'الرجاء إدخال كلمة المرور'); return; }

    encryptBtn.disabled = true;
    encryptBtn.textContent = 'جارِ التشفير...';
    try {
      const result = await encryptText(plain, pwd);
      outputText.value = result;
      showEncStatus('success', 'تم التشفير بنجاح');
    } catch (err) {
      outputText.value = '';
      showEncStatus('error', err.message || 'حدث خطأ غير متوقع أثناء التشفير');
    } finally {
      encryptBtn.disabled = false;
      encryptBtn.textContent = 'تشفير';
    }
  }

  function clearEncryptAll(){
    plainText.value = '';
    encPasswordInput.value = '';
    outputText.value = '';
    hideEncStatus();
  }

  function copyOutput(){
    const text = outputText.value;
    if (!text) return;
    navigator.clipboard?.writeText(text).catch(()=>{
      outputText.select();
      document.execCommand('copy');
    });
    const original = copyOutBtn.textContent;
    copyOutBtn.textContent = 'تم النسخ ✓';
    setTimeout(()=>{ copyOutBtn.textContent = original; }, 1200);
  }

  function saveOutput(){
    const text = outputText.value;
    if (!text) return;
    const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ARSF_encrypted_${Date.now()}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  encryptBtn.addEventListener('click', handleEncrypt);
  encClearBtn.addEventListener('click', clearEncryptAll);
  copyOutBtn.addEventListener('click', copyOutput);
  saveOutBtn.addEventListener('click', saveOutput);
  encPasswordInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); handleEncrypt(); } });

  /* ===================== قسم فك التشفير (منطق مطابق تمامًا للأصل) ===================== */
  const cipherText = document.getElementById('cipherText');
  const decPasswordInput = document.getElementById('decPassword');
  const decryptBtn = document.getElementById('decryptBtn');
  const decClearBtn = document.getElementById('decClearBtn');
  const decStatusBox = document.getElementById('decStatusBox');

  const overlay = document.getElementById('overlay');
  const modalResult = document.getElementById('modalResult');
  const closeModal = document.getElementById('closeModal');
  const copyBtn = document.getElementById('copyBtn');
  const saveBtn = document.getElementById('saveBtn');

  function showDecStatus(kind, message){
    decStatusBox.className = 'status ' + kind;
    const icon = kind === 'error' ? '⚠' : '✓';
    decStatusBox.innerHTML = `<span class="icon">${icon}</span><span>${message}</span>`;
  }
  function hideDecStatus(){
    decStatusBox.className = 'status hidden';
    decStatusBox.innerHTML = '';
  }

  function openModal(text){
    modalResult.textContent = text;
    overlay.classList.add('show');
  }
  function closeModalFn(){
    overlay.classList.remove('show');
  }
  closeModal.addEventListener('click', closeModalFn);
  overlay.addEventListener('click', (e)=>{ if (e.target === overlay) closeModalFn(); });
  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeModalFn(); });

  async function decryptText(encoded, password){
    const parts = encoded.split('$');
    if (parts.length !== 5) throw { message:'تنسيق النص غير صحيح — تأكدي من نسخ الناتج كاملاً' };
    if (parts[0] !== ARSF_MAGIC) throw { message:'هذا النص ليس بتنسيق ARSF1' };
    if (parts[1] !== ARSF_VERSION) throw { message:`إصدار غير مدعوم: ${parts[1]}` };

    const [, , saltB64, ivB64, dataB64] = parts;

    let salt, iv, encBuffer;
    try {
      salt = new Uint8Array(base64ToBuffer(saltB64));
      iv = new Uint8Array(base64ToBuffer(ivB64));
      encBuffer = base64ToBuffer(dataB64);
    } catch (e) {
      throw { message:'تعذّر قراءة بيانات النص المشفر — قد يكون تالفًا' };
    }

    const encoder = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:ITERATIONS, hash:'SHA-256' },
      keyMaterial, { name:'AES-GCM', length:256 }, false, ['decrypt']
    );

    try {
      const decrypted = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, encBuffer);
      return new TextDecoder().decode(decrypted);
    } catch (e) {
      throw { message:'كلمة المرور غير صحيحة، أو أن النص المشفر تالف' };
    }
  }

  async function handleDecrypt(){
    hideDecStatus();
    const encoded = cipherText.value.trim();
    const pwd = decPasswordInput.value;

    if (!encoded){ showDecStatus('error', 'الرجاء لصق النص المشفر أولاً'); return; }
    if (!pwd){ showDecStatus('error', 'الرجاء إدخال كلمة المرور'); return; }

    decryptBtn.disabled = true;
    decryptBtn.textContent = 'جارِ فك التشفير...';
    try {
      const result = await decryptText(encoded, pwd);
      openModal(result);
    } catch (err) {
      showDecStatus('error', err.message || 'حدث خطأ غير متوقع');
    } finally {
      decryptBtn.disabled = false;
      decryptBtn.textContent = 'فك التشفير';
    }
  }

  function clearDecryptAll(){
    cipherText.value = '';
    decPasswordInput.value = '';
    hideDecStatus();
  }

  function copyResult(){
    const text = modalResult.textContent;
    if (!text) return;
    navigator.clipboard?.writeText(text).catch(()=>{
      const r = document.createRange();
      r.selectNodeContents(modalResult);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      document.execCommand('copy');
      sel.removeAllRanges();
    });
    const original = copyBtn.textContent;
    copyBtn.textContent = 'تم النسخ ✓';
    setTimeout(()=>{ copyBtn.textContent = original; }, 1200);
  }

  function saveResult(){
    const text = modalResult.textContent;
    if (!text) return;
    const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ARSF_decrypted_${Date.now()}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  decryptBtn.addEventListener('click', handleDecrypt);
  decClearBtn.addEventListener('click', clearDecryptAll);
  copyBtn.addEventListener('click', copyResult);
  saveBtn.addEventListener('click', saveResult);
  decPasswordInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); handleDecrypt(); } });
})();
</script>
</body>
</html>
